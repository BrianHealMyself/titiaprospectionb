C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2f4978cd-57b9-4798-aaba-18395073b2f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #F3EDE3; }\n  a { color: #14406E; }\n  a:hover { color: #D9A441; }\n  input, textarea, button, select { font-family: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Source Sans 3', system-ui, sans-serif; color: #2A2A28; background: #F3EDE3; min-height: 100vh; padding: 28px 20px 80px;\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;\">\n\n  <header style=\"display: flex; flex-wrap: wrap; gap: 18px 32px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #DCD2C2; padding-bottom: 18px;\">\n    <div>\n      <div style=\"font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8A8474;\">Le Temps Relié · Laëtitia Rocher<\u002Fdiv>\n      <h1 style=\"font-family: 'Lora', serif; font-weight: 600; font-size: 34px; color: #14406E; margin: 8px 0 6px; line-height: 1.1;\">Plan de prospection<\u002Fh1>\n      <div style=\"font-size: 14px; color: #55524A; max-width: 56ch; text-wrap: pretty;\">Depuis Saint-Macaire-en-Mauges, jusqu'à Cholet, Beaupréau et Chemillé. Classé par priorité : d'abord ceux qui orientent vraiment vers vous. Vos créneaux : lundi, mercredi, vendredi, samedi matin.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n      <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"border: 1px solid #14406E; background: #14406E; color: #FBF8F2; padding: 10px 16px; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #0E3157;\">Télécharger le CSV pour Google Sheets<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetAll }}\" style=\"border: 1px solid #C9BFAC; background: transparent; color: #6E6A5E; padding: 10px 16px; border-radius: 3px; font-size: 13px; cursor: pointer;\" style-hover=\"border-color: #8A8474; color: #2A2A28;\">Réinitialiser le suivi<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: #DCD2C2; border: 1px solid #DCD2C2;\">\n    <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div style=\"background: #FBF8F2; padding: 16px 18px;\">\n        <div style=\"font-family: 'Lora', serif; font-size: 30px; color: #14406E; line-height: 1;\">{{ s.n }}<\u002Fdiv>\n        <div style=\"font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8474; margin-top: 7px;\">{{ s.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <div style=\"background: #FBF8F2; border: 1px solid #DCD2C2; padding: 10px 12px;\">\n    <div style=\"height: 10px; background: #EDE5D7; overflow: hidden;\">\n      <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 12.5px; color: #6E6A5E; margin-top: 9px;\">{{ progressLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"display: flex; flex-direction: column; gap: 11px;\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n      <span style=\"font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8474; width: 70px; flex: none;\">Priorité<\u002Fspan>\n      <sc-for list=\"{{ prioFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n      <span style=\"font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8474; width: 70px; flex: none;\">Type<\u002Fspan>\n      <sc-for list=\"{{ typeFilters }}\" as=\"f\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n      <span style=\"font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8474; width: 70px; flex: none;\">Statut<\u002Fspan>\n      <sc-for list=\"{{ statutFilters }}\" as=\"f\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display: flex; flex-direction: column; gap: 9px;\">\n    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n      <article style=\"{{ r.cardStyle }}\">\n        <div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 13px 16px; cursor: pointer;\" sc-camel-on-click=\"{{ r.toggle }}\">\n          <div style=\"{{ r.prioBadgeStyle }}\">{{ r.prio }}<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0;\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 5px 12px; align-items: baseline;\">\n              <div style=\"font-family: 'Lora', serif; font-size: 17.5px; color: #14406E; line-height: 1.2;\">{{ r.nom }}<\u002Fdiv>\n              <div style=\"font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8474;\">{{ r.type }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 13px; color: #55524A; margin-top: 3px;\">{{ r.ligneAdresse }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ r.statutStyle }}\">{{ r.statut }}<\u002Fdiv>\n          <div style=\"font-size: 15px; color: #A79E8C; line-height: 1; padding-top: 4px; flex: none;\">{{ r.chevron }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top: 1px solid #E5DCCB; padding: 18px 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 22px;\">\n\n            <div style=\"display: flex; flex-direction: column; gap: 14px; min-width: 0;\">\n              <div>\n                <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474; margin-bottom: 6px;\">La structure<\u002Fdiv>\n                <div style=\"font-size: 13.5px; line-height: 1.55; color: #2A2A28; text-wrap: pretty;\">{{ r.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474; margin-bottom: 6px;\">Coordonnées<\u002Fdiv>\n                <a href=\"{{ r.maps }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 13.5px; line-height: 1.5; display: inline-block; text-decoration: none; border-bottom: 1px solid #C9BFAC;\">{{ r.adresse }} ↗<\u002Fa>\n                <div style=\"font-size: 15px; font-weight: 600; color: #14406E; margin-top: 6px;\">{{ r.tel }}<\u002Fdiv>\n                <div style=\"font-size: 13px; color: #55524A;\">{{ r.mail }}<\u002Fdiv>\n                <div style=\"font-size: 12px; color: #8A8474; margin-top: 6px; line-height: 1.45;\">Demander : {{ r.interlocuteur }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"min-width: 0; border-left: 2px solid #D9A441; padding-left: 16px;\">\n              <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474; margin-bottom: 8px;\">Votre accroche<\u002Fdiv>\n              <div style=\"font-family: 'Lora', serif; font-size: 14.5px; line-height: 1.65; color: #2A2A28; font-style: italic; text-wrap: pretty;\">« {{ r.accroche }} »<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"min-width: 0;\">\n              <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474; margin-bottom: 8px;\">Conseils pour cette visite<\u002Fdiv>\n              <ul style=\"margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 7px;\">\n                <sc-for list=\"{{ r.conseils }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <li style=\"font-size: 13px; line-height: 1.5; color: #44413A; text-wrap: pretty;\">{{ c }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n\n            <div style=\"grid-column: 1 / -1; border-top: 1px solid #E5DCCB; padding-top: 14px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 7px; align-items: center;\">\n                <span style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474; margin-right: 4px;\">Où j'en suis<\u002Fspan>\n                <sc-for list=\"{{ r.statutBtns }}\" as=\"b\" hint-placeholder-count=\"7\">\n                  <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start;\">\n                <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474;\">Date du contact\n                  <input type=\"date\" value=\"{{ r.date }}\" sc-camel-on-change=\"{{ r.onDate }}\" style=\"border: 1px solid #DCD2C2; background: #FFFDF9; padding: 8px 10px; font-size: 13px; color: #2A2A28; border-radius: 2px; letter-spacing: normal; text-transform: none;\">\n                <\u002Flabel>\n                <label style=\"flex: 1; min-width: 230px; display: flex; flex-direction: column; gap: 5px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8474;\">Notes / prochaine étape\n                  <textarea rows=\"2\" value=\"{{ r.note }}\" sc-camel-on-change=\"{{ r.onNote }}\" placeholder=\"Personne rencontrée, ce qui a été dit, à relancer le…\" style=\"border: 1px solid #DCD2C2; background: #FFFDF9; padding: 9px 11px; font-size: 13.5px; color: #2A2A28; border-radius: 2px; resize: vertical; line-height: 1.5; letter-spacing: normal; text-transform: none;\"><\u002Ftextarea>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <footer style=\"border-top: 1px solid #DCD2C2; padding-top: 16px; font-size: 12.5px; line-height: 1.6; color: #6E6A5E; text-wrap: pretty;\">\n    Coordonnées relevées sur les annuaires publics (sevremoine.fr, maugescommunaute.fr, annuaires santé). Les lignes « à vérifier » n'ont pas de numéro confirmé : un appel au standard ou une recherche Maps suffit. Vérifiez le numéro avant de vous déplacer, les cabinets libéraux changent souvent.\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240}}\">\nconst KEY = 'ltr-prospection-v1';\nconst STATUTS = ['À faire', 'À appeler', 'RDV pris', 'Visité', 'Relance', 'Partenaire', 'Sans suite'];\nconst SC = {\n  'À faire':      ['#EDE5D7', '#55524A'],\n  'À appeler':    ['#E3EAF3', '#14406E'],\n  'RDV pris':     ['#FAEFD6', '#8A6410'],\n  'Visité':       ['#E4EDE3', '#3D6B3A'],\n  'Relance':      ['#F7E3D3', '#9A5622'],\n  'Partenaire':   ['#14406E', '#FBF8F2'],\n  'Sans suite':   ['#F0EDE8', '#6E6A5E']\n};\n\n// [id, nom, type, prio, commune, dist, adresse, tel, mail, interlocuteur, detail, accroche, [conseils]]\nconst D = [\n// ─────────── PRIORITÉ 1 ───────────\n['avresne',\"Résidence Autonomie de l'Avresne\",'Résidence autonomie',1,'St Macaire-en-Mauges','3 min',\"Allée de l'Avresne, St Macaire-en-Mauges, 49450 Sèvremoine\",'02 41 49 09 80','','Responsable de résidence, puis l’animatrice',\n\"53 logements, public, à partir de 1 368 €/mois. Résidents autonomes ou semi-autonomes, pas de psychologue salarié sur place. Restaurant, animations, portage de repas.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue à Saint-Macaire. J'ai travaillé dix ans en centre mémoire hospitalier et j'accompagne aujourd'hui les personnes âgées chez elles ou en résidence. Vos résidents sont autonomes mais souvent seuls : je propose des entretiens individuels sur place, et je peux animer un temps collectif si cela vous intéresse.\",\n[\"Votre cible n°1 : pas de psy en interne, résidents autonomes qui décident eux-mêmes de leurs dépenses, et c'est à trois minutes de chez vous.\",\"Passez par l'animatrice avant la direction : c'est elle qui sait qui va mal, et sa recommandation vaut plus qu'un flyer.\",\"Proposez une intervention gratuite de découverte : un café-échange d'une heure sur « bien vieillir chez soi ». C'est votre meilleur levier d'entrée.\",\"Demandez l'autorisation d'afficher un flyer dans le hall et de laisser des cartes à l'accueil.\",\"Repérez le jour du repas collectif : c'est là que vous verrez le plus de résidents en une fois.\"]],\n\n['cabinet-aigremoine','Cabinet infirmier Aigremoine','Cabinet infirmier',1,'St Macaire-en-Mauges','2 min','3 rue Pasteur, St Macaire-en-Mauges, 49450 Sèvremoine','07 68 67 64 49','cabinet.infirmier.saintmacaire@gmail.com','Chupin, Cogny, Leman ou Pasquier — n’importe lequel des quatre',\n\"Cabinet de groupe au pôle santé. Permanence sans rendez-vous mardi et samedi de 7h à 7h30, tournées à domicile le reste du temps. Ils entrent chez les personnes âgées tous les jours.\",\n\"Bonjour, je suis psychologue et neuropsychologue, installée ici à Saint-Macaire. J'ai passé dix ans en centre mémoire à l'hôpital et je travaille aussi en EHPAD. Je me déplace à domicile pour du soutien psychologique auprès des personnes âgées. Vous voyez souvent des patients qui vont mal moralement sans que personne ne prenne le relais : je suis là pour ça.\",\n[\"Les infirmiers libéraux sont votre meilleur prescripteur : ils voient l'isolement et la détresse avant tout le monde.\",\"Venez le samedi matin pendant la permanence 7h-7h30, ou déposez sans rendez-vous en fin de matinée.\",\"Parlez leur langage : évoquez le patient dépressif après un deuil, l'aidant épuisé, le refus de soin. Pas de théorie.\",\"Laissez 10 cartes de visite, pas une seule : ils les donnent en tournée.\",\"Mentionnez le centre mémoire : ça leur donne un motif d'orientation concret (troubles cognitifs, plainte mnésique).\"]],\n\n['csi-mauges','Centre de Soins Infirmiers des Mauges','Cabinet infirmier',1,'St Macaire-en-Mauges','2 min','3 rue Pasteur, St Macaire-en-Mauges, 49450 Sèvremoine','à vérifier','','Infirmière coordinatrice',\n\"Centre de soins salarié, 7j/7, soins à domicile et permanence au cabinet. Accès PMR, tiers payant. Structure organisée, avec une coordination : une seule personne peut diffuser votre nom à toute l'équipe.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, spécialisée dans l'accompagnement des personnes âgées à domicile. Dix ans en centre mémoire hospitalier. Je souhaitais me présenter à votre coordinatrice : quand un de vos patients traverse un passage difficile, vous avez maintenant quelqu'un à qui l'adresser sur place.\",\n[\"Visez la coordinatrice, pas les soignants un par un : une réunion d'équipe suffit à diffuser votre nom à tout le monde.\",\"Proposez de venir cinq minutes à une réunion d'équipe pour vous présenter. C'est souvent accepté et ça vaut vingt visites.\",\"Apportez la plaquette pro, pas le flyer grand public.\"]],\n\n['ccas-sevremoine','CCAS de Sèvremoine','CCAS',1,'St Macaire-en-Mauges','4 min','Hôtel de ville, 23 place Henri Doizy, St Macaire-en-Mauges, 49450 Sèvremoine','02 44 09 07 02','ccas@sevremoine.fr','Responsable du CCAS ou référent seniors',\n\"Le CCAS accompagne les publics fragiles de toute la commune nouvelle (25 800 habitants, 10 communes déléguées). Aides sociales facultatives, travailleurs sociaux, registre canicule. Ils savent où sont les personnes âgées isolées.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue installée à Saint-Macaire. Je propose du soutien psychologique à domicile pour les personnes âgées de la commune. Je viens me faire connaître de vos travailleurs sociaux : quand vous repérez une situation d'isolement ou de souffrance morale, il existe désormais une réponse locale.\",\n[\"Prenez rendez-vous par mail plutôt que de passer : le CCAS travaille sur agenda.\",\"Demandez à figurer dans leur annuaire de professionnels et sur le site sevremoine.fr (fiche point d'intérêt gratuite).\",\"Demandez aussi si la commune organise une Semaine bleue ou un forum seniors : un stand y vaut des mois de prospection.\",\"Les travailleurs sociaux transmettent beaucoup mais oublient vite : proposez-leur un mail récapitulatif d'une page qu'ils pourront archiver.\"]],\n\n['clic-mauges','CLIC de Mauges Communauté','CLIC / coordination',1,'Beaupréau','20 min','Mauges Communauté, Beaupréau, 49600 Beaupréau-en-Mauges','02 41 71 77 00','clic@maugescommunaute.fr','Coordinatrice du CLIC',\n\"Le guichet d'information seniors de tout le territoire des Mauges. Ils tiennent l'annuaire de l'aide à domicile et des SSIAD et orientent les familles toute la journée. Un seul contact, un rayonnement énorme.\",\n\"Bonjour, je suis psychologue et neuropsychologue, installée à Saint-Macaire-en-Mauges. Dix ans en centre mémoire hospitalier, aujourd'hui en libéral auprès des personnes âgées à domicile et de leurs aidants. J'aimerais figurer dans votre annuaire et que vous sachiez à qui adresser les familles qui vous appellent en difficulté.\",\n[\"Le contact le plus rentable de toute cette liste : ils orientent des dizaines de familles par mois.\",\"Objectif concret de la visite : être inscrite dans leur annuaire et sur maugescommunaute.fr. Demandez-le explicitement.\",\"Prenez rendez-vous par mail, avec votre plaquette en pièce jointe.\",\"Demandez-leur ce qui manque sur le territoire : ils vous diront exactement où est la demande non couverte.\",\"Proposez-vous pour une intervention lors d'une de leurs actions de prévention (ateliers aidants, conférences).\"]],\n\n['admr-menhir','ADMR Le Menhir des Mauges','Aide à domicile',1,'St Macaire-en-Mauges','4 min','15 place Sainte-Marguerite, St Macaire-en-Mauges, 49450 Sèvremoine','à vérifier','','Responsable de secteur',\n\"Service d'aide et d'accompagnement à domicile (SAAD) associatif, implanté en centre-bourg. Leurs auxiliaires de vie entrent chez les personnes âgées plusieurs fois par semaine et voient tout.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire. J'interviens à domicile auprès des personnes âgées et de leurs familles. Vos intervenantes repèrent souvent des situations de détresse sans pouvoir y répondre : je viens vous laisser mes coordonnées pour qu'elles sachent à qui en parler.\",\n[\"Deux portes d'entrée : la responsable de secteur pour les bénéficiaires, et l'équipe elle-même — les aides à domicile sont souvent épuisées et peuvent devenir clientes.\",\"Proposez une intervention d'une heure auprès de leurs salariées sur l'épuisement professionnel : ça ouvre la porte et ça se rémunère.\",\"Passez un lundi ou un vendredi matin, quand le bureau est ouvert et les plannings faits.\"]],\n\n['ssiad-valdemoine','SSIAD Val de Moine','SSIAD',1,'Montfaucon-Montigné','12 min','40 bis rue Lofficial, Montfaucon-Montigné, 49230 Sèvremoine','02 41 64 67 68','ssiad-valdemoine@wanadoo.fr','Infirmière coordinatrice',\n\"Service de soins infirmiers à domicile couvrant le secteur Sèvremoine. L'infirmière coordinatrice évalue chaque admission au domicile : elle voit les situations les plus lourdes du territoire.\",\n\"Bonjour, je suis psychologue et neuropsychologue, dix ans en centre mémoire hospitalier, aujourd'hui en libéral à Saint-Macaire. J'accompagne à domicile les personnes âgées et les aidants. Lors de vos évaluations, vous rencontrez des situations où le soin ne suffit pas : je peux prendre le relais sur le volet psychologique.\",\n[\"L'infirmière coordinatrice est un prescripteur en or : elle fait des visites d'évaluation à domicile et voit les aidants à bout.\",\"Appelez d'abord pour caler un rendez-vous, le poste est rarement au bureau.\",\"Parlez de l'Équipe Spécialisée Alzheimer (ESA) du territoire : demandez si vous pouvez travailler en complément.\"]],\n\n['mds-sevremoine','Maison Départementale des Solidarités — annexe Sèvremoine','Service social',1,'St Macaire-en-Mauges','4 min','23 place Henri Doizy, St Macaire-en-Mauges, 49450 Sèvremoine','02 41 55 36 76','','Assistante sociale de secteur',\n\"Antenne du Département : suivi social, accès au logement, gestion de budget, accompagnement des situations fragiles. Complémentaire du CCAS, avec d'autres dossiers.\",\n\"Bonjour, je suis psychologue et neuropsychologue installée à Saint-Macaire, spécialisée auprès des personnes âgées. Je passe déposer mes coordonnées pour vos assistantes sociales : quand une situation relève du soutien psychologique plutôt que de l'aide matérielle, vous avez maintenant un relais local.\",\n[\"Demandez l'assistante sociale référente du secteur seniors, pas l'accueil général.\",\"Proposez de laisser une affichette A5 en salle d'attente.\",\"Reformulez votre offre en termes de coût pour eux : dites clairement votre tarif, ils orientent en fonction des moyens des familles.\"]],\n\n['pole-sante-stmacaire','Pôle santé de Saint-Macaire','Maison de santé',1,'St Macaire-en-Mauges','2 min','3 rue Pasteur, St Macaire-en-Mauges, 49450 Sèvremoine','à vérifier','','Médecins généralistes, un par un',\n\"Le regroupement médical du bourg : généralistes, infirmiers, paramédicaux au même endroit. Une visite bien menée touche plusieurs prescripteurs en un déplacement.\",\n\"Bonjour docteur, je suis Laëtitia Rocher, psychologue et neuropsychologue, installée à Saint-Macaire. Dix ans en centre mémoire hospitalier, et actuellement psychologue en EHPAD. Je propose du soutien psychologique à domicile pour vos patients âgés qui ne peuvent plus se déplacer. Je vous laisse mes coordonnées et ma plaquette.\",\n[\"Ne demandez jamais à voir le médecin en consultation : laissez plaquette + carte au secrétariat avec un mot manuscrit nominatif.\",\"Le mot manuscrit fait toute la différence : trois lignes, votre nom, ce que vous faites, votre numéro.\",\"Mentionnez le centre mémoire : c'est ce qui vous distingue d'un psychologue généraliste aux yeux d'un médecin.\",\"Précisez que vous vous déplacez : c'est l'argument décisif pour un patient de 85 ans sans voiture.\",\"Repassez à six semaines. Un médecin retient un nom à la troisième exposition, pas à la première.\"]],\n\n['mairie-sevremoine','Mairie de Sèvremoine','Mairie',1,'St Macaire-en-Mauges','4 min','23 place Henri Doizy, St Macaire-en-Mauges, 49450 Sèvremoine','02 41 55 36 76','','Adjoint aux affaires sociales / seniors, et le service communication',\n\"25 800 habitants, 10 communes déléguées. La commune édite un bulletin municipal, un site avec annuaire de points d'intérêt et organise des événements seniors.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue à Saint-Macaire, nouvellement installée en libéral auprès des personnes âgées. Je souhaiterais être référencée dans l'annuaire du site de la commune et savoir si le bulletin municipal accueille les nouvelles installations professionnelles.\",\n[\"Deux demandes précises : fiche gratuite sur sevremoine.fr (comme les cabinets infirmiers en ont une) et brève dans le bulletin municipal.\",\"Une brève « nouvelle installation » dans le bulletin est gratuite et lue par toute la commune. Demandez la date de bouclage.\",\"Demandez aussi l'adjoint aux affaires sociales : il connaît le tissu associatif senior.\"]],\n\n// ─────────── PRIORITÉ 2 ───────────\n['pharma-choletaise','Pharmacie Choletaise','Pharmacie',2,'St Macaire-en-Mauges','3 min','6 rue Choletaise, 49450 St Macaire-en-Mauges','02 41 55 31 42','','Le ou la titulaire, pas le comptoir',\n\"Officine du bourg, spécialisée en orthopédie, contention, matériel médical, maintien à domicile. Clientèle âgée nombreuse et fidèle.\",\n\"Bonjour, je suis psychologue et neuropsychologue, installée à Saint-Macaire. Je me déplace à domicile auprès des personnes âgées. Vous voyez passer beaucoup de vos clients qui vont mal, seuls ou en deuil. Puis-je vous laisser quelques cartes, et est-ce que vous accepteriez un flyer en vitrine ?\",\n[\"La pharmacie est le lieu de confidence par excellence des personnes âgées. Sous-estimé et gratuit.\",\"Venez hors affluence : mardi ou jeudi 14h15-15h, jamais le samedi matin ni en fin de journée.\",\"Demandez le titulaire par son nom. Le comptoir jettera vos cartes, le titulaire non.\",\"Objectif : un porte-cartes près de la caisse ou une affichette. Proposez-le explicitement.\",\"Ils font de l'orthopédie et du maintien à domicile : vous êtes complémentaires, dites-le.\"]],\n\n['pharma-bendavid','Pharmacie Bendavid','Pharmacie',2,'St Macaire-en-Mauges','3 min','73 rue du Commerce, 49450 St Macaire-en-Mauges','02 41 55 30 21','','Titulaire',\n\"Officine centre-bourg, livraison à domicile le jour même, téléconsultation, bilan de médication. La livraison à domicile veut dire qu'ils connaissent les personnes qui ne sortent plus.\",\n\"Bonjour, je suis psychologue à Saint-Macaire et j'interviens à domicile auprès des personnes âgées. Vous livrez chez des gens qui ne sortent plus : ce sont précisément les personnes que j'accompagne. Puis-je vous laisser des cartes pour votre livreur ?\",\n[\"Argument spécifique à leur donner : votre offre complète leur service de livraison à domicile.\",\"Demandez si le livreur peut glisser une carte dans les sacs des clients isolés — souvent accepté.\",\"Passez un mercredi matin, hors rush.\"]],\n\n['pharma-huet','Pharmacie Huet','Pharmacie',2,'St Macaire-en-Mauges','4 min','Place Clemenceau, 49450 St Macaire-en-Mauges','à vérifier','','Titulaire',\n\"Officine de place, flux quotidien de personnes âgées du bourg.\",\n\"Bonjour, je suis psychologue et neuropsychologue, nouvellement installée à Saint-Macaire. J'accompagne les personnes âgées à domicile. Accepteriez-vous de garder quelques cartes de visite à disposition ?\",\n[\"Tournée pharmacies : faites les cinq officines du bourg dans la même matinée, c'est un circuit de 20 minutes à pied.\",\"Une demande simple et modeste (« quelques cartes ») obtient presque toujours un oui. N'en demandez pas plus au premier passage.\"]],\n\n['pharma-godard','Pharmacie Godard','Pharmacie',2,'St Macaire-en-Mauges','4 min','Rue de la Poste, 49450 St Macaire-en-Mauges','à vérifier','','Titulaire',\n\"Officine de proximité, rue de la Poste.\",\n\"Bonjour, je suis psychologue à Saint-Macaire, je me déplace à domicile pour accompagner les personnes âgées. Je vous laisse mes coordonnées si jamais quelqu'un vous en parle.\",\n[\"À enchaîner dans la même tournée que Huet et Le Scrill & Corbel.\",\"Repassez dans deux mois pour réapprovisionner les cartes : c'est le prétexte parfait pour un second contact.\"]],\n\n['pharma-lescrill','Pharmacie Le Scrill & Corbel','Pharmacie',2,'St Macaire-en-Mauges','4 min','Place Saint-Maurice, 49450 St Macaire-en-Mauges','à vérifier','','Titulaire',\n\"Officine place Saint-Maurice, centre historique du bourg.\",\n\"Bonjour, je suis psychologue et neuropsychologue installée dans la commune, spécialisée auprès des personnes âgées à domicile. Puis-je vous laisser quelques cartes ?\",\n[\"Fin de tournée pharmacies du bourg.\",\"Notez le nom du titulaire dans vos notes : le rappeler au second passage change tout.\"]],\n\n['pharma-hy','Pharmacie Hy-Bénéteau','Pharmacie',2,'St André de la Marche','7 min','1 rue Louis Braille, St André de la Marche, 49450 Sèvremoine','02 41 55 32 15','','Titulaire',\n\"Officine de St André de la Marche, commune déléguée voisine. Élargit votre visibilité sans sortir de Sèvremoine.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, j'interviens à domicile sur toute la commune de Sèvremoine, y compris ici. Je viens me présenter et vous laisser des cartes.\",\n[\"Insistez sur « y compris ici » : les habitants des communes déléguées pensent que tout se passe à Saint-Macaire.\",\"À grouper avec les cabinets infirmiers de St André dans le même déplacement.\"]],\n\n['pharma-stgermain','Pharmacie de Saint-Germain-sur-Moine','Pharmacie',2,'St Germain-sur-Moine','12 min','5 rue des Rosiers, St Germain-sur-Moine, 49230 Sèvremoine','à vérifier','','Titulaire',\n\"Officine du bourg de Saint-Germain, secteur ouest de Sèvremoine, plus rural et plus isolé.\",\n\"Bonjour, je suis psychologue à Saint-Macaire et je me déplace dans tout Sèvremoine. Sur un secteur comme le vôtre, l'isolement des personnes âgées est réel. Je vous laisse mes coordonnées.\",\n[\"Secteur rural : l'argument du déplacement à domicile porte encore plus fort ici.\",\"À grouper avec la pharmacie de Saint-Germain, à deux pas, dans la même sortie ouest.\"]],\n\n['inf-terrien','Cabinet infirmier rue d\\u2019Anjou','Cabinet infirmier',2,'St Macaire-en-Mauges','3 min',\"48 rue d'Anjou, St Macaire-en-Mauges, 49450 Sèvremoine\",'à vérifier','','L’infirmière présente au cabinet',\n\"Cabinet libéral rue d'Anjou, à deux pas de l'EHPAD. Tournées à domicile quotidiennes sur le bourg.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, dix ans en centre mémoire. J'interviens à domicile auprès des personnes âgées. Je vous laisse des cartes : vous voyez souvent avant tout le monde ceux qui vont mal.\",\n[\"Les cabinets infirmiers ne sont au cabinet qu'aux permanences : appelez d'abord pour connaître le créneau.\",\"Un mot manuscrit glissé dans la boîte aux lettres marche aussi bien qu'une visite si vous ne les trouvez pas.\"]],\n\n['inf-leman','Cabinet infirmier rue des Mauges','Cabinet infirmier',2,'St Macaire-en-Mauges','3 min','Rue des Mauges, St Macaire-en-Mauges, 49230 Sèvremoine','à vérifier','','Alice ou Benoît Leman',\n\"Cabinet libéral, tournées à domicile sur le bourg et les hameaux.\",\n\"Bonjour, je suis psychologue à Saint-Macaire, spécialisée auprès des personnes âgées à domicile. Je viens me présenter aux cabinets infirmiers du secteur : nous allons croiser les mêmes patients.\",\n[\"« Nous allons croiser les mêmes patients » : cette phrase installe une relation entre pairs, pas une sollicitation.\",\"Laissez un jeu de cartes par infirmier, pas un pour le cabinet.\"]],\n\n['inf-fiefdares','Cabinet infirmier rue du Fief d\\u2019Arès','Cabinet infirmier',2,'Sèvremoine','8 min',\"3 rue du Fief d'Arès, 49230 Sèvremoine\",'à vérifier','','Amélie Delezire ou Virginie Deseine',\n\"Cabinet libéral ouvert en continu, secteur Sèvremoine.\",\n\"Bonjour, je suis psychologue et neuropsychologue installée à Saint-Macaire, j'interviens à domicile sur tout Sèvremoine. Je vous laisse mes coordonnées pour vos patients en difficulté morale.\",\n[\"Appelez avant : ce cabinet fonctionne surtout en tournée.\",\"Proposez de leur envoyer votre plaquette par mail plutôt que d'insister sur une visite.\"]],\n\n['inf-tillieres','Cabinet infirmier de Tillières','Cabinet infirmier',2,'Tillières','13 min','12 rue du Stade, Tillières, 49230 Sèvremoine','à vérifier','','Johannie Dollet',\n\"Cabinet rural, secteur est de Sèvremoine, peu couvert en offre psychologique.\",\n\"Bonjour, je suis psychologue à Saint-Macaire et je me déplace jusqu'ici. Sur les communes rurales, il n'y a quasiment rien en soutien psychologique pour les personnes âgées : c'est exactement ce que je propose.\",\n[\"Argument du désert : sur Tillières, vous êtes sans doute la seule offre. Dites-le franchement.\",\"À grouper avec l'ADMR Sangueze qui couvre Tillières.\"]],\n\n['psy-vigneron','Muriel Vigneron, psychologue','Confrère / réseau',2,'St Macaire-en-Mauges','3 min','Environ rue des Mauges, 49450 St Macaire-en-Mauges','à vérifier','','Elle-même',\n\"Psychologue déjà installée dans le bourg. Pas une concurrente frontale si elle ne fait pas de gériatrie à domicile : une source de réorientation.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue, je viens de m'installer en libéral à Saint-Macaire. Je me spécialise sur la personne âgée à domicile et le centre mémoire. Je préférais venir me présenter plutôt que vous laisser l'apprendre autrement, et voir si nous pouvons nous adresser des patients.\",\n[\"Y aller franchement est plus intelligent que l'éviter : les psys d'un même bourg finissent toujours par se croiser.\",\"Positionnez-vous clairement sur un créneau qu'elle ne couvre probablement pas : gériatrie, neuropsychologie, domicile.\",\"Les réorientations entre psychologues sont fréquentes et réciproques. Ça peut devenir votre première source.\"]],\n\n['ccas-stgermain','CCAS de Saint-Germain-sur-Moine','CCAS',2,'St Germain-sur-Moine','12 min','4 rue de la Mairie, 49230 Saint-Germain-sur-Moine','02 41 64 61 67','','Secrétariat de mairie / élu aux affaires sociales',\n\"CCAS de commune déléguée. Petite structure, mais les élus locaux connaissent personnellement les habitants âgés isolés.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, j'interviens à domicile sur toute la commune de Sèvremoine. Je viens me faire connaître des élus et du secrétariat : vous savez mieux que personne qui, ici, est seul.\",\n[\"Dans les petites communes, le secrétariat de mairie est le meilleur relais d'information du village.\",\"Demandez l'affichage d'un flyer sur le panneau de la mairie : c'est gratuit et très regardé.\"]],\n\n['ccas-montfaucon','CCAS de Montfaucon-Montigné','CCAS',2,'Montfaucon-Montigné','12 min','3 rue du Donjon, 49230 Montfaucon-Montigné','02 41 49 19 60','','Secrétariat de mairie',\n\"CCAS de commune déléguée, dans le même secteur que le SSIAD Val de Moine.\",\n\"Bonjour, je suis psychologue installée à Saint-Macaire, je me déplace à domicile auprès des personnes âgées sur tout Sèvremoine. Je souhaitais laisser mes coordonnées à la mairie.\",\n[\"À grouper dans la même sortie que le SSIAD Val de Moine, même bourg.\",\"Demandez le bulletin communal délégué : certains publient encore les nouvelles installations.\"]],\n\n['ccas-stcrespin','CCAS de Saint-Crespin-sur-Moine','CCAS',2,'St Crespin-sur-Moine','18 min','14 rue de Bretagne, 49230 Saint-Crespin-sur-Moine','02 41 70 42 04','','Secrétariat de mairie',\n\"Commune déléguée à la limite de la Loire-Atlantique. Secteur périphérique de votre zone.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, je me déplace jusqu'ici pour accompagner les personnes âgées à domicile.\",\n[\"Zone limite : n'y allez que si vous groupez avec Torfou ou Le Longeron dans la même sortie.\",\"Un appel téléphonique suffit peut-être pour ce niveau de priorité.\"]],\n\n['kine-stmacaire','Cabinets de kinésithérapie de Saint-Macaire','Kiné / paramédical',2,'St Macaire-en-Mauges','3 min','Pôle santé et cabinets du bourg, 49450 St Macaire-en-Mauges','à vérifier','','Kinés du cabinet',\n\"Les kinés voient leurs patients âgés une à trois fois par semaine, sur des séances longues. Ils sont souvent les confidents involontaires des personnes seules.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire. Vous passez vingt ou trente minutes avec vos patients âgés, souvent plus que n'importe qui d'autre. Quand la conversation dérive vers la tristesse ou la perte d'autonomie, vous avez maintenant quelqu'un vers qui les orienter.\",\n[\"Argument spécifique : la durée de la séance fait d'eux des témoins privilégiés. Dites-le, ils s'y reconnaîtront.\",\"Les kinés sont sur agenda serré : venez entre midi et deux ou en fin de journée, avec une carte et rien de plus.\"]],\n\n['ortho-stmacaire','Orthophonistes du secteur','Orthophoniste',2,'St Macaire-en-Mauges','5 min','St Macaire-en-Mauges, 49450 Sèvremoine','à vérifier','','L’orthophoniste',\n\"Les orthophonistes suivent les troubles du langage après AVC et les troubles cognitifs. Recouvrement direct avec votre expertise neuropsy.\",\n\"Bonjour, je suis neuropsychologue, dix ans en centre mémoire hospitalier. Nous suivons parfois les mêmes patients : troubles cognitifs, post-AVC, maladies neurodégénératives. Je propose un accompagnement psychologique à domicile qui peut compléter votre travail.\",\n[\"C'est ici que votre profil neuropsy vaut le plus : parlez bilan cognitif, aphasie, plainte mnésique.\",\"Proposez un échange professionnel, pas une prestation : les orthophonistes réorientent volontiers entre pairs.\",\"Le recouvrement de patientèle en fait un partenariat durable, pas une visite unique.\"]],\n\n['ccas-beaupreau','CCAS de Beaupréau-en-Mauges','CCAS',2,'Beaupréau','20 min','24 rue Mont de Vie, Beaupréau, 49600 Beaupréau-en-Mauges','02 41 63 03 33','','Responsable du CCAS',\n\"CCAS d'une grande commune nouvelle voisine, 22 000 habitants. Point d'entrée du secteur nord de votre zone : travailleurs sociaux, registre canicule, guide seniors.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue installée à Saint-Macaire. J'interviens à domicile auprès des personnes âgées jusqu'à Beaupréau. Je viens me faire connaître de vos travailleurs sociaux.\",\n[\"Groupez : CCAS de Beaupréau + CLIC Mauges Communauté + ADMR Cot-Èvre + GD Services, tous à Beaupréau. Une seule sortie.\",\"Annoncez clairement que vous vous déplacez jusqu'ici, sinon ils vous croiront cantonnée à Sèvremoine.\"]],\n\n// ─────────── PRIORITÉ 3 ───────────\n\n\n\n\n\n\n\n\n['grande-fontaine','Résidence autonomie La Grande Fontaine','Résidence autonomie',2,'Le May-sur-Èvre','15 min','Boulevard du 8 Mai 1945, 49122 Le May-sur-Èvre','02 41 63 25 97','','Responsable de résidence, puis l’animatrice',\n\"Village retraite du CCAS de Cholet : 52 logements dont 20 pavillons individuels et 28 T1 bis. Résidents autonomes, non médicalisés, donc aucun psychologue salarié. Présence de personnel 24h/24 et repas collectifs quotidiens.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue à Saint-Macaire. J'accompagne les personnes âgées chez elles ou en résidence, après dix ans en centre mémoire hospitalier. Vos résidents sont autonomes mais beaucoup vivent seuls dans leur pavillon : je propose des entretiens individuels sur place, et je peux animer un temps collectif si cela vous intéresse.\",\n[\"Configuration idéale : autonomes, pas de psy interne, et ils décident eux-mêmes de leurs dépenses.\",\"Les pavillons individuels isolent beaucoup plus que les appartements : c'est votre argument d'entrée.\",\"Passez par l'animatrice avant la direction — elle sait qui va mal.\",\"Proposez une causerie gratuite d'une heure : « bien vieillir chez soi ». Le collectif amène ensuite l'individuel.\",\"Cette résidence dépend du CCAS de Cholet : une bonne impression ici ouvre les trois autres.\"]],\n['aide-multipresence','Aide et Multiprésence','Aide à domicile',3,'Cholet','22 min','2 boulevard de la Victoire, 49300 Cholet','02 41 58 79 77','contact@aideetmultipresence.fr','Responsable de secteur Sèvremoine',\n\"Service d'aide à domicile intervenant explicitement sur Le Longeron, Torfou, Saint-Macaire et Saint-André-de-la-Marche. Ils ont déjà des bénéficiaires dans votre rue.\",\n\"Bonjour, je suis psychologue et neuropsychologue installée à Saint-Macaire. Vous intervenez sur mon secteur : vos auxiliaires voient des situations d'isolement et de détresse tous les jours. Je viens vous laisser mes coordonnées pour qu'elles sachent à qui en parler.\",\n[\"Ils interviennent nommément sur Saint-Macaire : c'est votre argument d'ouverture, utilisez-le.\",\"Contact par mail d'abord, avec plaquette : le siège est à Cholet, le déplacement n'est pas indispensable.\",\"Proposez une sensibilisation d'une heure à leurs intervenantes : c'est un service rémunéré autant qu'une porte d'entrée.\"]],\n\n['gd-services','GD Services Beaupréau','Aide à domicile',3,'Beaupréau','20 min','34 rue Saint-Martin, Beaupréau, 49600 Beaupréau-en-Mauges','02 51 14 36 10','beaupreau@gdservices.fr','Responsable d’agence',\n\"Service d'aide à domicile du secteur nord des Mauges.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, j'interviens à domicile auprès des personnes âgées. Je souhaite me faire connaître de vos responsables de secteur.\",\n[\"Mail en premier contact, avec plaquette en pièce jointe.\",\"À grouper avec le CCAS de Beaupréau et l'ADMR Cot-Èvre.\"]],\n\n\n['admr-cotevre','ADMR Cot-Èvre','Aide à domicile',3,'Beaupréau','20 min','15 rue Françoise Dolto, Beaupréau, 49600 Beaupréau-en-Mauges','02 41 63 54 89','cot-evre@asso.fede49.admr.org','Responsable de secteur',\n\"Association ADMR du secteur Beaupréau.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral à Saint-Macaire, j'interviens à domicile auprès des personnes âgées sur les Mauges. Je viens me faire connaître de vos équipes.\",\n[\"Le réseau ADMR est fédéré : une bonne impression dans une association circule vers les autres.\",\"Mail d'abord, avec plaquette.\"]],\n\n['admr-sangueze','ADMR Sangueze','Aide à domicile',3,'Gesté','18 min','9 place Monseigneur Dupont, Gesté, 49600 Beaupréau-en-Mauges','02 41 63 19 32','sangueze@asso.fede49.admr.org','Responsable de secteur',\n\"Couvre Gesté, Villedieu-la-Blouère et Tillières — donc une partie de Sèvremoine.\",\n\"Bonjour, je suis psychologue à Saint-Macaire et j'interviens sur Tillières, que vous couvrez également. Je souhaitais me présenter.\",\n[\"Ils couvrent Tillières : mentionnez-le, ça crée un terrain commun immédiat.\",\"Secteur nord : à grouper avec l'ADMR Cot-Èvre et le CCAS de Beaupréau dans la même journée.\"]],\n\n['ssiad-loire-mauges','SSIAD Loire Mauges','SSIAD',3,'Mauges-sur-Loire','30 min','92 rue Bonchamps, La Chapelle-Saint-Florent, 49410 Mauges-sur-Loire','02 41 72 76 45','coordination-ouest@ssiadloiremauges.fr','Infirmière coordinatrice',\n\"SSIAD couvrant Mauges-sur-Loire, Montrevault-sur-Èvre et Orée-d'Anjou. Extrémité nord-ouest de votre périmètre.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Je propose un accompagnement psychologique à domicile pour les personnes âgées et leurs aidants.\",\n[\"Bord de périmètre : mail uniquement en premier contact.\",\"Ne vous déplacez que s'ils manifestent un intérêt.\"]],\n\n['ccas-cholet','CCAS de Cholet','CCAS',2,'Cholet','22 min','Mairie, rue Saint-Bonaventure, 49321 Cholet','02 41 49 25 25','','Service seniors / responsable CCAS',\n\"CCAS d'une ville de 54 000 habitants. Volume important mais concurrence forte et circuits plus formels.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue, dix ans en centre mémoire hospitalier, installée en libéral à Saint-Macaire-en-Mauges. J'interviens à domicile sur Cholet. Je souhaite être référencée auprès de vos services seniors.\",\n[\"Grande ville : passez par un mail formel au service seniors, pas par l'accueil.\",\"Objectif précis : figurer dans leur guide seniors, souvent édité chaque année. Demandez la date de bouclage.\",\"Concurrence réelle sur Cholet : votre argument est le déplacement à domicile sur les communes rurales alentour.\"]],\n\n['ccas-trementines','CCAS de Trémentines','CCAS',3,'Trémentines','20 min',\"1 rue d'Anjou, 49340 Trémentines\",'02 41 62 55 25','','Secrétariat de mairie',\n\"CCAS de petite commune du sud-est de votre périmètre.\",\n\"Bonjour, je suis psychologue à Saint-Macaire, j'interviens à domicile auprès des personnes âgées jusqu'ici. Je laisse mes coordonnées à la mairie.\",\n[\"Appel téléphonique suffisant en premier contact.\",\"À grouper avec le CCAS de Chemillé, sur le même axe sud-est.\"]],\n\n// ─────────── CHOLET ET AGGLOMÉRATION ───────────\n['res-bosquet','Résidence autonomie Le Bosquet','Résidence autonomie',2,'Cholet','22 min','7 rue Tournerit, 49300 Cholet','02 41 62 85 79','','Responsable de résidence, puis l’animatrice',\n\"Résidence autonomie du CCAS de Cholet, en plein centre-ville, passée de 40 à 80 appartements. Résidents autonomes, aucun psychologue salarié, proximité de la vie culturelle. La plus grande résidence autonomie du secteur.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue. Dix ans en centre mémoire hospitalier, aujourd'hui en libéral, je me déplace sur Cholet auprès des personnes âgées. Vos résidents sont autonomes mais souvent seuls : je propose des entretiens individuels sur place, et des temps collectifs si cela vous intéresse.\",\n[\"80 appartements sans psychologue en interne : le plus gros gisement de la liste après l'Avresne.\",\"Les quatre résidences autonomie de Cholet dépendent du même CCAS. Décrochez celle-ci et vous parlez aux trois autres.\",\"Passez par l'animatrice, puis demandez la direction avec son accord.\",\"Proposez un cycle de trois causeries plutôt qu'une seule : mémoire, deuil, adaptation au logement. Une série s'inscrit au programme d'animation.\",\"Sur Cholet vous n'êtes plus la psy du coin : ouvrez sur le centre mémoire, pas sur la proximité.\"]],\n\n['res-girardiere','Résidence autonomie La Girardière','Résidence autonomie',2,'Cholet','22 min','Résidence La Girardière, 49300 Cholet','à vérifier','','Responsable de résidence',\n\"Résidence autonomie pour personnes âgées valides et couples, avec accueil temporaire. L'accueil temporaire est intéressant : ce sont des périodes de transition, donc de fragilité psychique.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Vous accueillez des personnes en séjour temporaire : ce sont souvent des moments de bascule, après une hospitalisation ou un deuil. C'est exactement là que j'interviens.\",\n[\"Angle spécifique à cette résidence : l'accueil temporaire. Personne ne travaille ce créneau, et le besoin y est aigu.\",\"Groupez les quatre résidences autonomie choletaises sur une même journée, sur rendez-vous.\",\"Demandez systématiquement le nom de l'animatrice avant de repartir.\"]],\n\n['res-notredame','Résidence autonomie Notre Dame','Résidence autonomie',2,'Cholet','22 min','Résidence Notre Dame, 49300 Cholet','à vérifier','','Responsable de résidence',\n\"Résidence autonomie non médicalisée, environ 1 000 m² au sud-ouest de Cholet. Public autonome à revenus modestes.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral à Saint-Macaire-en-Mauges, je me déplace sur Cholet. Je propose du soutien psychologique aux personnes âgées, sur place dans votre résidence.\",\n[\"Public à revenus modestes : préparez une réponse claire sur votre tarif et sur les aides possibles.\",\"À enchaîner avec Le Bosquet et La Girardière dans la même sortie choletaise.\",\"Demandez si la résidence dispose d'un budget animation : certaines interventions collectives sont finançables par la structure, pas par les résidents.\"]],\n\n\n\n['clic-choletais','Guichet seniors de l’Agglomération du Choletais','CLIC / coordination',2,'Cholet','22 min','Agglomération du Choletais, rue Saint-Bonaventure, 49300 Cholet','02 41 49 25 25','','Coordinateur seniors / CLIC',\n\"Point d'information et de coordination pour les seniors du Choletais. Comme le CLIC des Mauges, un seul contact qui rayonne sur des dizaines d'orientations par mois.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue installée à Saint-Macaire-en-Mauges. J'interviens à domicile jusqu'à Cholet. J'aimerais figurer parmi les professionnels que vous communiquez aux familles.\",\n[\"Objectif unique et concret : être inscrite dans leur annuaire de professionnels. Demandez-le explicitement.\",\"Mail formel avec plaquette, puis relance téléphonique à dix jours.\",\"Demandez-leur ce qui manque sur le Choletais : ils connaissent les trous de l'offre mieux que quiconque.\"]],\n\n\n\n['inf-cholet','Cabinets infirmiers de Cholet','Cabinet infirmier',3,'Cholet','22 min','Cholet, 49300','à vérifier','','Infirmiers libéraux',\n\"Nombreux cabinets libéraux répartis sur la ville. Volume important mais relation plus distante qu'à Saint-Macaire : vous n'êtes pas du quartier.\",\n\"Bonjour, je suis neuropsychologue, dix ans en centre mémoire à l'hôpital, installée en libéral dans les Mauges. Je me déplace sur Cholet pour du soutien psychologique auprès des personnes âgées. Je vous laisse des cartes.\",\n[\"Sur Cholet la proximité ne joue pas : votre argument est le centre mémoire, pas le voisinage.\",\"Ciblez d'abord les cabinets des quartiers à population âgée plutôt que le centre.\",\"Priorité basse tant que Sèvremoine n'est pas épuisé : une visite à Saint-Macaire rapporte plus qu'une à Cholet.\"]],\n\n['msp-cholet','Maisons et pôles de santé de Cholet','Maison de santé',3,'Cholet','22 min','Cholet, 49300','à vérifier','','Coordinateur de la maison de santé',\n\"Regroupements pluriprofessionnels : généralistes, infirmiers, paramédicaux au même endroit. Un coordinateur diffuse l'information à toute l'équipe.\",\n\"Bonjour, je suis Laëtitia Rocher, neuropsychologue. Je propose du soutien psychologique à domicile pour les patients âgés qui ne peuvent plus se déplacer jusqu'à vous. Je souhaiterais être connue de votre équipe.\",\n[\"Demandez le coordinateur, pas les médecins : c'est lui qui fait circuler l'information.\",\"Certaines maisons de santé cherchent activement un psychologue pour leur projet de santé. Posez la question.\",\"Mail avec plaquette avant tout déplacement.\"]],\n\n['pharma-cholet','Tournée pharmacies de Cholet','Pharmacie',4,'Cholet','22 min','Cholet, 49300','à vérifier','','Titulaires',\n\"Une vingtaine d'officines sur la ville. Rendement plus faible qu'à Saint-Macaire mais coût par visite très bas si vous groupez.\",\n\"Bonjour, je suis psychologue et neuropsychologue, j'interviens à domicile auprès des personnes âgées sur Cholet et les Mauges. Accepteriez-vous quelques cartes à disposition ?\",\n[\"Ne faites pas les vingt : choisissez les officines des quartiers les plus âgés, cinq maximum.\",\"Une matinée, cinq pharmacies, un porte-cartes demandé à chaque fois.\",\"À ne faire qu'une fois les priorités 1 et 2 traitées.\"]],\n\n['res-chanteriviere','Résidence Chanterivière','Résidence autonomie',2,'Cholet','22 min','Résidence Chanterivière, Cholet, 49300','à vérifier','','Responsable de résidence, puis l’animatrice',\n\"Résidence pour seniors à Cholet, hébergement permanent, avec un pôle d'activités et un accueil possible de personnes présentant des troubles de type Alzheimer.\",\n\"Bonjour, je suis Laëtitia Rocher, neuropsychologue, dix ans en centre mémoire hospitalier. J'accompagne les personnes présentant des troubles cognitifs et leurs familles. Je peux intervenir chez vous en complément de votre pôle d'activités.\",\n[\"Troubles cognitifs annoncés dans leur projet : c'est votre terrain exact, ouvrez là-dessus.\",\"Demandez à voir le responsable du pôle d'activités autant que la direction.\",\"À enchaîner avec Le Bosquet et Notre Dame, même ville.\"]],\n\n['res-oui-seniors','Oui Seniors Cholet','Résidence services',2,'Cholet','22 min','Oui Seniors, Cholet, 49300','à vérifier','','Directeur de résidence / responsable animation',\n\"Résidence services privée pour seniors autonomes : appartements en location, restauration, animations quotidiennes, accueil 7j/7.\",\n\"Bonjour, je suis psychologue et neuropsychologue, dix ans en centre mémoire hospitalier. J'interviens auprès des personnes âgées en résidence. Vos résidents sont autonomes et solvables, et beaucoup traversent seuls des passages difficiles. Je propose des entretiens sur place et des temps collectifs.\",\n[\"Public solvable qui paie lui-même : pas de dossier de financement, pas d'attente.\",\"Parlez au responsable animation : c'est lui qui a le budget et le programme.\",\"Présentez une prestation qui enrichit leur offre commerciale, pas un soin.\",\"Proposez une convention simple : une demi-journée par mois sur place.\"]],\n\n['res-du-lac','Résidence du Lac','Résidence services',2,'Cholet','22 min','Résidence du Lac, Cholet, 49300','à vérifier','','Directeur de résidence / responsable animation',\n\"Résidence services seniors à Cholet, logements en location pour personnes autonomes avec prestations à la carte.\",\n\"Bonjour, je suis neuropsychologue en libéral, installée dans les Mauges. Je propose aux résidences seniors des permanences sur place : entretiens individuels et ateliers mémoire. Je souhaitais vous présenter ce que je fais.\",\n[\"L'atelier mémoire est le produit d'appel parfait ici : demandé par les résidents, et vous êtes légitime dessus.\",\"Apportez un programme écrit d'atelier sur six séances, ça se décide beaucoup plus vite qu'une idée orale.\",\"Groupez les quatre résidences services choletaises sur une même après-midi.\"]],\n\n['res-duchene','Résidence Mobicap « Le Duchêne »','Résidence services',3,'Cholet','22 min','Résidence Le Duchêne, Cholet, 49300','à vérifier','','Responsable de résidence',\n\"Résidence services seniors à Cholet, logements adaptés pour personnes autonomes.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Je propose des permanences en résidence senior : entretiens individuels, accompagnement des transitions, ateliers mémoire.\",\n[\"Vérifiez sur Maps que la résidence est bien en activité avant de vous déplacer.\",\"À enchaîner avec Oui Seniors et la Résidence du Lac.\"]],\n\n['res-senioriales','Les Senioriales de Cholet','Résidence services',3,'Cholet','22 min','Les Senioriales, Cholet, 49300','à vérifier','','Responsable de résidence',\n\"Résidence services seniors ouverte récemment à Cholet. Une résidence jeune cherche à étoffer son programme d'animation : opportunité d'y entrer tôt.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Votre résidence est récente : je propose d'intervenir régulièrement auprès de vos résidents, en entretien individuel comme en atelier collectif.\",\n[\"Résidence récente = programme d'animation en construction = porte ouverte.\",\"Demandez à rencontrer le responsable animation dès la première visite, pas seulement la direction.\"]],\n\n['adj-magnolias','Accueil de jour Les Magnolias','Accueil de jour',2,'Cholet','22 min','Accueil de jour Les Magnolias, Cholet, 49300','à vérifier','','Responsable de l’accueil de jour',\n\"Accueil de jour autonome : personnes vivant à domicile accueillies à la journée, majoritairement pour troubles cognitifs, avec un objectif de répit pour l'aidant.\",\n\"Bonjour, je suis neuropsychologue, dix ans en centre mémoire hospitalier, aujourd'hui en libéral. Vos usagers vivent à domicile et leurs aidants sont souvent épuisés. Je peux prendre le relais chez eux, entre deux journées d'accueil.\",\n[\"La cible la plus précise de toute la liste pour votre profil : troubles cognitifs, domicile, aidants.\",\"L'aidant est ici votre vrai client : identifié, présent, et en souffrance reconnue.\",\"Proposez d'animer un groupe de parole d'aidants — besoin permanent de ces structures, et rémunéré.\",\"Demandez s'ils remettent une liste de professionnels aux familles.\",\"Cholet compte un second accueil de jour autonome : demandez-leur son nom, ils le connaissent.\"]],\n\n['admr-choletais','ADMR du Choletais','Aide à domicile',2,'Cholet','22 min','ADMR du Choletais, Cholet, 49300','à vérifier','','Responsable de secteur',\n\"Service d'aide et d'accompagnement à domicile du réseau ADMR sur le Choletais. Réseau fédéré : une bonne impression ici circule vers les autres associations ADMR du département.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral dans les Mauges. Vos intervenantes repèrent des situations de détresse qu'elles ne peuvent pas traiter. Je viens laisser mes coordonnées pour qu'elles sachent à qui en parler.\",\n[\"Vous démarchez déjà trois associations ADMR : citez-les, le réseau se parle.\",\"Double opportunité : les bénéficiaires, et les salariées épuisées — une sensibilisation d'une heure se facture.\",\"Demandez cinq minutes en réunion d'équipe : ça vaut vingt visites individuelles.\"]],\n\n['generale-services','Générale des Services Cholet','Aide à domicile',3,'Cholet','22 min','Générale des Services, Cholet, 49300','à vérifier','','Responsable d’agence',\n\"Service d'aide à domicile privé sur Cholet, intervenant auprès de personnes âgées à leur domicile.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. J'interviens à domicile auprès des personnes âgées sur Cholet et les Mauges. Je souhaite me faire connaître de vos responsables de secteur.\",\n[\"Structure privée : l'argument commercial fonctionne, présentez-vous comme un service complémentaire à proposer à leurs clients.\",\"Mail avec plaquette en premier contact.\"]],\n\n['saad-cholet-autres','Autres services d’aide à domicile de Cholet','Aide à domicile',4,'Cholet','22 min','Cholet, 49300','à vérifier','','Responsables de secteur',\n\"Cholet compte treize services d'aide à domicile recensés. Au-delà de l'ADMR et de Générale des Services, les onze autres se traitent par mail groupé plutôt qu'en visite.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue en libéral dans les Mauges. J'interviens à domicile auprès des personnes âgées jusqu'à Cholet. Je vous adresse ma plaquette afin que vos intervenantes sachent à qui adresser les situations de détresse qu'elles rencontrent.\",\n[\"Listez-les depuis l'annuaire de Mauges Communauté ou de cholet.fr, puis un seul mail type à envoyer à chacun.\",\"Ne vous déplacez que chez ceux qui répondent.\",\"À traiter un jour de pluie, depuis chez vous.\"]],\n\n['ssiad-bocage','SSIAD Le Bocage','SSIAD',3,'Cholet','22 min','SSIAD Le Bocage, Cholet, 49300','à vérifier','','Infirmière coordinatrice',\n\"Service de soins infirmiers à domicile du secteur choletais. La coordinatrice évalue chaque admission au domicile : elle voit les situations les plus lourdes.\",\n\"Bonjour, je suis psychologue et neuropsychologue, dix ans en centre mémoire hospitalier. Lors de vos évaluations à domicile, vous rencontrez des situations où le soin ne suffit pas. Je peux prendre le relais sur le volet psychologique.\",\n[\"L'infirmière coordinatrice est le meilleur prescripteur d'un SSIAD.\",\"Appelez pour caler un rendez-vous, le poste est rarement au bureau.\",\"À grouper avec l'accueil de jour Les Magnolias, même journée.\"]],\n\n['ssiad-maulevrier','SSIAD de Maulévrier','SSIAD',4,'Maulévrier','25 min','SSIAD, 49360 Maulévrier','à vérifier','','Infirmière coordinatrice',\n\"SSIAD du sud du Choletais, secteur très rural. Peu d'offre psychologique disponible sur cette zone.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Je me déplace à domicile jusqu'ici, sur un secteur où il n'y a quasiment pas d'offre de soutien psychologique pour les personnes âgées.\",\n[\"Bord de périmètre : appel ou mail d'abord, déplacement seulement s'ils sont intéressés.\",\"Argument du désert rural : appuyez dessus, c'est votre seul avantage sur cette zone.\"]],\n\n['ccas-chemille','CCAS de Chemillé-en-Anjou','CCAS',3,'Chemillé','25 min','Mairie, place du Château, 49120 Chemillé-en-Anjou','02 41 30 60 00','','Responsable du CCAS / référent seniors',\n\"Commune nouvelle de 21 000 habitants, extrémité est de votre périmètre, encore jamais démarchée. Le CCAS y centralise l'information seniors.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue et neuropsychologue installée à Saint-Macaire-en-Mauges. J'interviens à domicile auprès des personnes âgées et je me déplace jusqu'à Chemillé. Je souhaite être connue de vos travailleurs sociaux et de votre service seniors.\",\n[\"Zone entièrement vierge pour vous : aucun psychologue libéral identifié qui vienne de votre côté des Mauges.\",\"Mail d'abord avec la plaquette, puis une journée groupée avec le CCAS de Trémentines, sur le même axe.\",\"Demandez leur guide seniors annuel et la date de bouclage.\"]],\n\n\n['pharma-mojtabi','Pharmacie Mojtabi','Pharmacie',3,'Bégrolles-en-Mauges','8 min','Rue des Mauges, 49122 Bégrolles-en-Mauges','à vérifier','','Titulaire',\n\"Officine de la commune voisine, sur l'axe Saint-Macaire – Cholet.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, j'interviens à domicile auprès des personnes âgées jusqu'ici. Puis-je vous laisser quelques cartes ?\",\n[\"Sur votre route vers Cholet : à caler sur un trajet déjà prévu.\",\"Une demande modeste au premier passage obtient presque toujours un oui.\"]],\n\n['pharma-ducentre','Pharmacie du Centre','Pharmacie',3,'Le May-sur-Èvre','15 min','Rue Saint-Louis, 49122 Le May-sur-Èvre','à vérifier','','Titulaire',\n\"Officine du bourg du May-sur-Èvre, même commune que l'EHPA non médicalisé.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, spécialisée dans l'accompagnement des personnes âgées à domicile. Je viens me présenter.\",\n[\"À grouper avec l'EHPA du May-sur-Èvre, qui est votre meilleure cible du secteur.\",\"Mentionnez que vous allez aussi à la résidence : ça vous crédibilise localement.\"]],\n\n['pharma-limousin','Pharmacie Limousin-Lusseau','Pharmacie',3,'La Romagne','10 min','Rue Nationale, 49740 La Romagne','à vérifier','','Titulaire',\n\"Officine d'une petite commune rurale au sud de Saint-Macaire, secteur peu couvert.\",\n\"Bonjour, je suis psychologue à Saint-Macaire et je me déplace dans les communes rurales alentour. Ici, l'isolement des personnes âgées est réel et il n'y a quasiment pas d'offre. Je vous laisse mes coordonnées.\",\n[\"Commune rurale sans offre psychologique : votre argument du déplacement porte à plein.\",\"Dix minutes de trajet : rentabilité élevée pour une visite courte.\"]],\n\n['pharma-schmitzberger','Pharmacie Schmitzberger','Pharmacie',4,'Beaupréau','20 min','Rue des Chevaliers de Malte, 49600 Beaupréau','à vérifier','','Titulaire',\n\"Officine du centre de Beaupréau, secteur nord.\",\n\"Bonjour, je suis psychologue et neuropsychologue à Saint-Macaire, j'interviens à domicile jusqu'à Beaupréau. Accepteriez-vous quelques cartes ?\",\n[\"À ne faire que le jour où vous montez à Beaupréau pour le CCAS et le CLIC.\",\"Deux officines à Beaupréau : faites les deux dans la même heure.\"]],\n\n['pharma-baranger','Pharmacie Baranger','Pharmacie',4,'Beaupréau','20 min','Rue des Tilleuls, 49600 Beaupréau','à vérifier','','Titulaire',\n\"Seconde officine de Beaupréau.\",\n\"Bonjour, je suis psychologue à Saint-Macaire, je me déplace à domicile auprès des personnes âgées sur les Mauges. Je vous laisse mes coordonnées.\",\n[\"À enchaîner directement après Schmitzberger.\",\"Priorité basse : ne montez pas à Beaupréau pour les seules pharmacies.\"]],\n\n// ─────────── PRIORITÉ 4 ───────────\n['ch-cholet','Centre Hospitalier de Cholet — consultation mémoire','Hôpital',4,'Cholet','22 min','1 rue Marengo, 49300 Cholet','02 41 49 63 63','','Neurologue ou psychologue de la consultation mémoire',\n\"Votre terrain d'origine : dix ans en centre mémoire. La consultation mémoire de Cholet annonce des diagnostics et n'a pas de suivi à domicile à proposer ensuite.\",\n\"Bonjour, je suis Laëtitia Rocher, neuropsychologue. J'ai exercé dix ans en centre mémoire hospitalier et je me suis installée en libéral à Saint-Macaire. Vous posez des diagnostics et les familles repartent souvent sans accompagnement. Je propose exactement ce relais, à domicile.\",\n[\"Le contact le plus qualifié de la liste sur le plan clinique : vous parlez leur langue.\",\"Écrivez un courrier professionnel plutôt qu'une visite : un hôpital ne reçoit pas à l'improviste.\",\"L'argument est imparable : l'après-diagnostic n'est pas assuré, et vous le connaissez de l'intérieur.\",\"Demandez si l'équipe tient une liste de professionnels libéraux à remettre aux familles. Souvent oui.\"]],\n\n\n['club-aines','Club des aînés / Générations Mouvement','Association',4,'St Macaire-en-Mauges','5 min','Espace associatif, St Macaire-en-Mauges, 49450 Sèvremoine','via le service associations de Sèvremoine','','Président du club',\n\"Club de retraités actifs du bourg : repas, jeux, sorties. Ce sont les seniors les moins isolés, mais ils ont tous un voisin ou un conjoint qui l'est.\",\n\"Bonjour, je suis Laëtitia Rocher, psychologue à Saint-Macaire. Je propose de venir animer gratuitement une causerie d'une heure pour vos adhérents : « bien vieillir, et quoi faire quand le moral n'y est plus ».\",\n[\"N'y allez pas pour vendre : proposez une conférence gratuite. C'est la seule approche qui fonctionne avec une association.\",\"Une causerie devant 40 personnes vaut 40 visites individuelles, et le bouche-à-oreille fait le reste.\",\"Prévoyez des flyers en fin de séance, jamais au début.\"]],\n\n['mediatheque','Médiathèque de Saint-Macaire','Lieu public',4,'St Macaire-en-Mauges','5 min','Médiathèque, St Macaire-en-Mauges, 49450 Sèvremoine','à vérifier','','Responsable de la médiathèque',\n\"Lieu public fréquenté, souvent partant pour accueillir des conférences ou des ateliers, et disposant de panneaux d'affichage.\",\n\"Bonjour, je suis psychologue à Saint-Macaire. Je souhaitais savoir si vous accueillez des conférences : je pourrais animer une séance sur la mémoire et le vieillissement, ouverte à tous.\",\n[\"Une conférence « la mémoire qui flanche : quand faut-il s'inquiéter ? » remplit une salle. C'est votre sujet.\",\"Coût nul, et la commune relaie l'événement dans son agenda.\",\"Demandez aussi simplement l'affichage d'un flyer sur leur panneau.\"]],\n\n\n['mutuelles','Mutuelles et caisses complémentaires locales','Mutuelle',4,'Cholet / St Macaire','—','Agences de Cholet et Saint-Macaire','à vérifier','','Conseiller / chargé de prévention',\n\"Certaines mutuelles financent des séances de soutien psychologique ou organisent des ateliers prévention pour leurs adhérents retraités.\",\n\"Bonjour, je suis psychologue et neuropsychologue en libéral. Je souhaitais savoir si votre mutuelle rembourse les séances de psychologue et si vous organisez des actions de prévention auprès de vos adhérents retraités.\",\n[\"Double intérêt : le remboursement partiel lève un frein financier chez vos clients, et les ateliers prévention sont rémunérés.\",\"Demandez surtout la liste des mutuelles qui remboursent : c'est un argument à donner ensuite à vos patients.\",\"Priorité basse tant que vous n'avez pas épuisé les prescripteurs de santé.\"]]\n];\n\nconst F = (a) => ({ id:a[0], nom:a[1], type:a[2], prio:a[3], commune:a[4], dist:a[5], adresse:a[6], tel:a[7], mail:a[8], interlocuteur:a[9], detail:a[10], accroche:a[11], conseils:a[12] });\nconst ITEMS = D.map(F).sort((a, b) => a.prio - b.prio);\nconst TYPES = [...new Set(ITEMS.map(i => i.type))];\n\nclass Component extends DCLogic {\n  state = { track: {}, open: null, fPrio: 'Toutes', fType: 'Tous', fStatut: 'Tous' };\n\n  componentDidMount() {\n    try { const raw = localStorage.getItem(KEY); if (raw) this.setState({ track: JSON.parse(raw) }); } catch (e) {}\n  }\n  save(track) { this.setState({ track }); try { localStorage.setItem(KEY, JSON.stringify(track)); } catch (e) {} }\n  entry(id) { return this.state.track[id] || { statut: 'À faire', date: '', note: '' }; }\n  patch(id, p) { const t = { ...this.state.track }; t[id] = { ...this.entry(id), ...p }; this.save(t); }\n\n  chip(active, tone) {\n    const base = 'padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;border:1px solid;transition:all .12s;';\n    if (active) return base + 'background:' + (tone || '#14406E') + ';border-color:' + (tone || '#14406E') + ';color:#FBF8F2;font-weight:600;';\n    return base + 'background:#FBF8F2;border-color:#DCD2C2;color:#6E6A5E;';\n  }\n\n  filterSet(key, values, current) {\n    return values.map(v => ({\n      label: String(v),\n      style: this.chip(current === v),\n      onClick: () => this.setState({ [key]: v })\n    }));\n  }\n\n  exportCsv = () => {\n    const head = ['Priorité','Statut','Date contact','Nom','Type','Commune','Trajet','Adresse','Lien Maps','Téléphone','Email','Interlocuteur','La structure','Accroche','Conseils','Mes notes'];\n    const esc = (s) => '\"' + String(s == null ? '' : s).split('\"').join('\"\"') + '\"';\n    const lines = [head.map(esc).join(',')];\n    ITEMS.forEach(i => {\n      const e = this.entry(i.id);\n      lines.push([i.prio, e.statut, e.date, i.nom, i.type, i.commune, i.dist, i.adresse,\n        'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(i.adresse),\n        i.tel, i.mail || '', i.interlocuteur, i.detail, i.accroche, i.conseils.map(c => '• ' + c).join(' \\n'), e.note].map(esc).join(','));\n    });\n    const blob = new Blob(['\\ufeff' + lines.join('\\r\\n')], { type: 'text/csv;charset=utf-8;' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'Prospection - Le Temps Relie.csv';\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n  };\n\n  resetAll = () => { if (confirm('Effacer tous les statuts, dates et notes ?')) this.save({}); };\n\n  renderVals() {\n    const { track, open, fPrio, fType, fStatut } = this.state;\n    const done = ITEMS.filter(i => ['Visité','Partenaire','Sans suite'].includes(this.entry(i.id).statut)).length;\n    const pct = Math.round(done / ITEMS.length * 100);\n\n    const count = (s) => ITEMS.filter(i => this.entry(i.id).statut === s).length;\n    const stats = [\n      { label: 'Contacts', n: ITEMS.length },\n      { label: 'À faire', n: count('À faire') },\n      { label: 'RDV pris', n: count('RDV pris') },\n      { label: 'Visités', n: count('Visité') },\n      { label: 'À relancer', n: count('Relance') },\n      { label: 'Partenaires', n: count('Partenaire') }\n    ];\n\n    const visible = ITEMS.filter(i => {\n      const e = this.entry(i.id);\n      if (fPrio !== 'Toutes' && i.prio !== Number(String(fPrio).replace(/\\D/g, ''))) return false;\n      if (fType !== 'Tous' && i.type !== fType) return false;\n      if (fStatut !== 'Tous' && e.statut !== fStatut) return false;\n      return true;\n    });\n\n    const prioTone = { 1: '#14406E', 2: '#D9A441', 3: '#8A8474', 4: '#B9B0A0' };\n\n    const rows = visible.map(i => {\n      const e = this.entry(i.id);\n      const isOpen = open === i.id;\n      const [bg, fg] = SC[e.statut] || SC['À faire'];\n      return {\n        ...i,\n        open: isOpen,\n        statut: e.statut, date: e.date, note: e.note,\n        chevron: isOpen ? '▴' : '▾',\n        ligneAdresse: i.commune + (i.dist !== '—' ? ' · ' + i.dist + ' de chez vous' : ''),\n        maps: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(i.adresse),\n        cardStyle: 'background:#FBF8F2;border:1px solid ' + (isOpen ? '#C9BFAC' : '#E5DCCB') + ';border-left:3px solid ' + prioTone[i.prio] + ';',\n        prioBadgeStyle: 'flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:' + prioTone[i.prio] + ';color:#FBF8F2;',\n        statutStyle: 'flex:none;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;background:' + bg + ';color:' + fg + ';white-space:nowrap;',\n        toggle: () => this.setState({ open: isOpen ? null : i.id }),\n        onDate: (ev) => this.patch(i.id, { date: ev.target.value }),\n        onNote: (ev) => this.patch(i.id, { note: ev.target.value }),\n        statutBtns: STATUTS.map(s => ({\n          label: s,\n          style: this.chip(e.statut === s, SC[s][0] === '#14406E' ? '#14406E' : '#14406E'),\n          onClick: () => this.patch(i.id, { statut: s, date: e.date || new Date().toISOString().slice(0, 10) })\n        }))\n      };\n    });\n\n    return {\n      stats, rows,\n      progressStyle: 'height:100%;width:' + pct + '%;background:#D9A441;transition:width .3s;',\n      progressLabel: done + ' contacts traités sur ' + ITEMS.length + ' — ' + pct + '% du plan. ' + (pct === 0 ? 'Commencez par les priorités 1 : la moitié se fait à pied depuis le centre-bourg.' : 'Continuez par priorité, pas par proximité.'),\n      prioFilters: this.filterSet('fPrio', ['Toutes', '1', '2', '3', '4'], fPrio),\n      typeFilters: this.filterSet('fType', ['Tous', ...TYPES], fType),\n      statutFilters: this.filterSet('fStatut', ['Tous', ...STATUTS], fStatut),\n      exportCsv: this.exportCsv,\n      resetAll: this.resetAll\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
